services:
  temporal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.3
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy

  factory-worker:
    image: node:24-bookworm
    profiles: ["worker"]
    working_dir: /app
    volumes:
      - ../../..:/app:ro
    command: sh -lc "npm ci && npm run build && npm run worker"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      FACTORY_WORKER_MODULE: /app/dist/temporal/production-worker.js
    depends_on:
      temporal:
        condition: service_started

  temporal-ui:
    image: temporalio/ui:2.44.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal

volumes:
  temporal-postgres-data:
