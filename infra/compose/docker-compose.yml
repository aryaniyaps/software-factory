services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes: ["./litellm.config.yaml:/app/config.yaml:ro"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://factory:factory@postgres:5432/factory}
    depends_on:
      postgres:
        condition: service_healthy

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports: ["8888:8888", "9999:9999"]
    environment:
      HINDSIGHT_API_WORKER_ID: factory-local
    volumes: ["hindsight-data:/home/hindsight/.hindsight"]

volumes:
  postgres-data:
  hindsight-data:

# Local LGTM observability profile:
#   docker compose -f infra/compose/docker-compose.yml -f infra/observability/docker-compose.lgtm.yml up
#
# Factory services should export OTLP to http://127.0.0.1:4318 with:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#   OTEL_SERVICE_NAME=software-factory
