services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.80.0-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes: ["./litellm.config.yaml:/app/config.yaml:ro"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://factory:factory@postgres:5432/factory}
    depends_on:
      postgres:
        condition: service_healthy

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.8.6
    ports: ["8888:8888", "9999:9999"]
    environment:
      HINDSIGHT_API_WORKER_ID: factory-local
    volumes: ["hindsight-data:/home/hindsight/.hindsight"]

volumes:
  postgres-data:
  hindsight-data:
